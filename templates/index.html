<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1a0000; border: 2px solid #ff1a1a; border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 8px 25px rgba(255, 26, 26, 0.4); text-align: center; }
        h1 { color: #ff3333; margin-bottom: 10px; font-size: 24px; }
        .divider { width: 100%; height: 2px; background-color: #ffffff; margin: 15px 0 25px 0; border-radius: 2px; opacity: 0.8; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; background: #260000; border: 1px solid #ff4d4d; border-radius: 6px; color: #fff; font-size: 16px; outline: none; }
        input[type="text"]::placeholder { color: #ff9999; }
        button { width: 100%; padding: 12px; background: #cc0000; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #ff1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WM Downloader</h1>
        <div class="divider"></div>
        <form method="POST">
            <input type="text" name="url" placeholder="Cole o link aqui..." required>
            <button type="submit">Baixar</button>
        </form>
    </div>
</body>
</html>
